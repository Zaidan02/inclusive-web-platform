services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CORS_ALLOW_ORIGIN: '^http://(localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3}):5173$'
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      SCORING_ENGINE_URL: http://scoring-engine:5001
      PROFILE_AI_URL: http://voice-navigation:5002
      PROFILE_AI_TOKEN: ${PROFILE_AI_TOKEN:-}
    working_dir: /app
    command: ["sh", "-c", "php bin/console cache:clear --env=prod --no-warmup && php bin/console cache:warmup --env=prod && exec apache2-foreground"]
    volumes:
      - .:/app
      - ../tools:/tools:ro
      - vendor_data:/app/vendor
      - symfony_var:/app/var
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy
      scoring-engine:
        condition: service_healthy
      voice-navigation:
        condition: service_healthy

  scoring-engine:
    build:
      context: ..
      dockerfile: scoring_engine/Dockerfile
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  voice-navigation:
    build:
      context: ./voice_navigation
      dockerfile: Dockerfile
    env_file:
      - path: ./voice_navigation/.env
        required: false
    environment:
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: 5002
      VOICE_ALLOWED_ORIGIN: 'http://localhost:5173,http://127.0.0.1:5173,http://192\.168\.[0-9]+\.[0-9]+:5173'
      PROFILE_AI_TOKEN: ${PROFILE_AI_TOKEN:-}
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
  vendor_data:
  symfony_var:
