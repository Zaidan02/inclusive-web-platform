security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_CANDIDATE: ROLE_USER
        ROLE_EMPLOYER: ROLE_USER
        ROLE_VERIFIER: ROLE_USER
        ROLE_ADMIN: [ROLE_USER, ROLE_VERIFIER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_EMPLOYER]

    providers:
        login_user_provider:
            entity:
                class: App\Entity\User
                property: email

        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login_check$
            stateless: true
            provider: login_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        public_api:
            pattern: ^/api/(register|verify-email|resend-verification|forgot-password|reset-password)$|^/api/docs(?:\.|/|$)
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-verification$, roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs(?:\.|/|$), roles: PUBLIC_ACCESS }

        - { path: ^/api/jobs$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/job-definitions$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/public-overview$, roles: PUBLIC_ACCESS, methods: [GET] }

        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/verifier, roles: ROLE_VERIFIER }
        - { path: ^/api/candidate, roles: ROLE_CANDIDATE }
        - { path: ^/api/employer, roles: ROLE_EMPLOYER }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
